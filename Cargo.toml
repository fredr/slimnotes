[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
slimnotes-core = { path = "crates/core" }
