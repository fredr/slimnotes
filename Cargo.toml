[workspace]
resolver = "3"
members = ["crates/core", "crates/editor", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
slimnotes-core = { path = "crates/core" }
slimnotes-editor = { path = "crates/editor" }

# GPUI (Zed's UI framework) + the gpui-component widget library. gpui-component
# 0.5.1 depends on the crates.io gpui 0.2.2, so both are pinned together.
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
pulldown-cmark = { version = "0.13", default-features = false }
# Same major as gpui's own image dep, so `image::Frame` is the exact type
# `RenderImage::new` expects.
image = "0.25"

# Optimize dependencies even in dev builds. Text shaping (rustybuzz/cosmic-text,
# via gpui) is ~50x slower unoptimized, which made large notes freeze for seconds
# on a plain `cargo run`. Our own crates stay at the default dev opt-level so
# incremental rebuilds stay fast; only third-party deps get optimized (they
# rarely change, so this cost is paid once).
[profile.dev.package."*"]
opt-level = 3
