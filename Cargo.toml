[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
slimnotes-core = { path = "crates/core" }

# GPUI (Zed's UI framework) + the gpui-component widget library. gpui-component
# 0.5.1 depends on the crates.io gpui 0.2.2, so both are pinned together.
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
