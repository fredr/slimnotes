[package]
name = "slimnotes-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A from-scratch GPUI live-preview markdown editor."

[dependencies]
gpui = { workspace = true }
pulldown-cmark = { workspace = true }
image = { workspace = true }
# Syntax highlighting for fenced code blocks. `default-fancy` uses the pure-Rust
# fancy-regex engine (no onig/C dependency), bundling the default syntax and
# theme sets. `two-face` extends that with the bat-curated syntax set (~200
# languages: TypeScript/TSX, TOML, Nix, Dockerfile, GraphQL, … which syntect's
# defaults lack); `syntect-fancy` keeps it on the same pure-Rust engine.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
