[package]
name = "slimnotes-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A from-scratch GPUI live-preview markdown editor."

[dependencies]
gpui = { workspace = true }
pulldown-cmark = { workspace = true }
image = { workspace = true }
ropey = { workspace = true }
# Syntax highlighting for fenced code blocks. `default-fancy` uses the pure-Rust
# fancy-regex engine (no onig/C dependency). `two-face` extends syntect's default
# set with the bat-curated syntaxes (TypeScript/TSX, TOML, Nix, …).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
